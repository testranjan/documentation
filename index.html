<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Multilingual Documentation</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="header-left">

            <div class="logo">
                📚
            </div>

            <div class="title">

                <h1>
                    PRE-TRAINING OUTLET VISIT
                </h1>

                <p>
                    & AWARENESS PROGRAM
                </p>

            </div>

        </div>


        <!-- LANGUAGE SELECTOR -->

        <div class="language-section">

            <span class="language-icon">
                🌐
            </span>

            <select id="languageSelect">

                <option value="english">
                    🇬🇧 English
                </option>

                <option value="japanese">
                    🇯🇵 日本語
                </option>

                <option value="nepali">
                    🇳🇵 नेपाली
                </option>

                <option value="hindi">
                    🇮🇳 हिन्दी
                </option>

            </select>

        </div>

    </header>



    <!-- =========================
         PDF VIEWER SECTION
    ========================== -->

    <main class="main-content">


        <!-- PDF TITLE -->

        <div class="document-info">

            <div>

                <h2 id="documentTitle">
                    English Documentation
                </h2>

                <p id="documentDescription">
                    Pre-Training Outlet Visit & Awareness Program
                </p>

            </div>


            <!-- OPEN PDF BUTTON -->

            <a
                id="openPdf"
                href="pdf/english.pdf"
                target="_blank"
                class="open-button"
            >

                ↗ Open PDF

            </a>

        </div>



        <!-- PDF VIEWER -->

        <div class="pdf-container">

            <iframe
                id="pdfViewer"
                src="pdf/english.pdf"
                title="Documentation PDF"
            >

            </iframe>

        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            Multilingual Documentation Portal
        </p>

    </footer>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
